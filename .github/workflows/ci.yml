name: ci
on: [push, pull_request]

jobs:
  gate:
    name: tests, demo, mutation, claims gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Full test suite (stdlib-only)
        run: python tests/run_all.py
      - name: Calibration demo (byte-identical guarantee)
        run: python -m authpath demo
      - name: Mutation — conservation (floor 6/7)
        run: python tools/mutate_conservation.py
      - name: Mutation — evidence discipline (floor 8/8)
        run: python tools/mutate_evidence.py
      - name: Mutation — certificate (floor 10/10)
        run: python tools/mutate_certificate.py
      - name: RL20 no-bare-metrics gate
        run: python tools/check_claims.py

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check authpath tests tools

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q
